<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Awesome Attorneys — The First Offer</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>

  *{margin:0;padding:0;box-sizing:border-box}

         transform-origin:top left;background:var(--cream)}

        column-gap:.28em;row-gap:.06em}

  .hero{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-0.015em;line-height:1.08}
  .sup {font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-0.01em;line-height:1.12}
  .lbl {font-family:Inter,sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.14em}
  .bdy {font-family:Inter,sans-serif;font-weight:500}

  #wipe,#card{position:absolute;inset:0;pointer-events:none}
  .img{position:absolute;transform-origin:50% 50%;will-change:transform,opacity}

  #safe{position:absolute;inset:0;pointer-events:none;display:none}
  #safe div{position:absolute;background:rgba(224,57,63,.16);
            border-top:1px dashed rgba(224,57,63,.7);border-bottom:1px dashed rgba(224,57,63,.7)}

  #panel{width:300px;flex:none;background:#111;border:1px solid #2a2a2a;border-radius:12px;padding:16px}
  #panel h3{font:600 12px Inter;text-transform:uppercase;letter-spacing:.12em;color:#888;margin-bottom:12px}
  #panel label{display:block;margin:12px 0 4px;font-size:11px;color:#999;
               text-transform:uppercase;letter-spacing:.08em}
  #panel input[type=range]{width:100%}
  #panel input[type=text],#panel input[type=color],#panel select{
    width:100%;background:#1c1c1c;border:1px solid #333;color:#ddd;padding:6px;border-radius:6px}
  #panel .row{display:flex;gap:8px;align-items:center;margin-top:10px}
  #panel button{background:#8A2326;color:#fff;border:0;padding:8px 14px;border-radius:6px;
                cursor:pointer;font:600 12px Inter}
  #tval{font-variant-numeric:tabular-nums;color:#B68A4E;font-weight:600}
</style>
</head>
<body>

<script>
/* ============================================================================
   THE FIRST OFFER — 1080x1920, 22.5s, 60fps.
   Every frame is a pure function of t. No CSS animation/transition, no
   Date.now, no Math.random, no rAF-derived timing. Scrubbing to any t twice
   produces identical pixels.

   Timings come from data/timing_reference.json (measured, not estimated):
   silencedetect for sentence-initial onsets, whisper word timestamps
   mid-sentence, each shifted -0.05s per the brief's "hits land 0.05s before
   the word is heard".
   ========================================================================= */

const W = 1080, H = 1920, DUR = 22.5, STILL = 22.0;   // frozen for the last 0.5s
const C = {
  cream:'#FBF7EF', black:'#0A0A0A', ink:'#14110F', white:'#FFFFFF',
  brand:'#8A2326', brandDeep:'#5E1619', brass:'#B68A4E', brassLight:'#D9B780',
  parchment:'#F1E8D8', sand:'#E4D9C3', inkSoft:'#4A443C'
};

/* ---------- easing ------------------------------------------------------- */
function bez(x1,y1,x2,y2){
  return function(x){
    if(x<=0) return 0; if(x>=1) return 1;
    let lo=0, hi=1, t=x;
    for(let i=0;i<26;i++){
      const u=1-t, cx=3*u*u*t*x1 + 3*u*t*t*x2 + t*t*t;
      if(cx<x) lo=t; else hi=t;
      t=(lo+hi)/2;
    }
    const u=1-t;
    return 3*u*u*t*y1 + 3*u*t*t*y2 + t*t*t;
  };
}
const expoOut   = bez(0.16,1,0.3,1);      // slides, reveals
const expoIn    = bez(0.7,0,0.84,0);      // exits
const expoInOut = bez(0.87,0,0.13,1);     // the circle wipe

const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const lerp  = (a,b,p)=>a+(b-a)*p;

function iv(t,t0,t1,v0,v1,ease){
  if(t<=t0) return v0;
  if(t>=t1) return v1;
  const p=(t-t0)/(t1-t0);
  return lerp(v0,v1,ease?ease(p):p);
}
/* explicit overshoot pop: from -> peak -> to. 6% over final by default. */
function pop(t,t0,dur,from,peak,to){
  const p=clamp((t-t0)/dur,0,1);
  return p<0.55 ? iv(p,0,0.55,from,peak,expoOut)
                : iv(p,0.55,1,peak,to,expoOut);
}
function mixHex(a,b,p){
  p=clamp(p,0,1);
  const A=parseInt(a.slice(1),16), B=parseInt(b.slice(1),16);
  const r=Math.round(lerp(A>>16,B>>16,p));
  const g=Math.round(lerp((A>>8)&255,(B>>8)&255,p));
  const bl=Math.round(lerp(A&255,B&255,p));
  return `rgb(${r},${g},${bl})`;
}

/* which background is live at time t (before any wipe/card overlay) */
function bgAt(t){
  if(t < 3.10) return C.cream;
  if(t < 7.00) return C.black;
  if(t < 12.43) return C.cream;
  if(t < 16.55) return C.brand;
  return C.cream;
}
function onDark(t){ return (t>=3.10 && t<7.00) || (t>=12.43 && t<16.55); }

/* palette for text at time t */
function inkAt(t){
  if(t>=12.43 && t<16.55) return C.white;      // on brand red
  return onDark(t) ? C.white : C.ink;
}
function accentAt(t){
  if(t>=12.43 && t<16.55) return C.white;      // white accent on red
  return onDark(t) ? C.brass : ACCENT;         // brass on black (site token)
}

  <div class="lbl" style="position:absolute;left:80px;top:74px;width:200px;text-align:center;

  <div class="lbl" style="position:absolute;right:80px;top:74px;width:200px;text-align:center;

     border-radius:50px;background:${C.brand};color:${C.cream};

<div id="handle" class="lbl" style="position:absolute;right:90px;bottom:120px;font-size:30px"></div>

const $=id=>document.getElementById(id);
const roadPath=$('roadPath'), sigPath=$('sigPath'), ringC=$('ringC');
const ROAD_LEN=roadPath.getTotalLength(), SIG_LEN=sigPath.getTotalLength(),
      RING_LEN=2*Math.PI*330;

/* ---------- the frame function ------------------------------------------ */
function render(tRaw){
  const t  = clamp(tRaw,0,DUR);
  const tm = Math.min(t,STILL);            // continuous motion freezes at 22.0s
  const dark = onDark(t);

  /* background + grid */
  elBg.style.background = bgAt(t);
  const gc = dark ? 'rgba(255,255,255,0.10)' : 'rgba(0,0,0,0.10)';
  elGrid.style.backgroundImage = `radial-gradient(${gc} 2.4px, transparent 2.5px)`;
  elGrid.style.backgroundSize  = '44px 44px';
  const drift = tm*8/Math.SQRT2;
  elGrid.style.backgroundPosition = `${drift}px ${drift}px`;
  elGrid.style.opacity = (t>=12.43 && t<16.55) ? 0.5 : 1;

  /* camera breathing — resets on each cut */
  const cuts=[0,3.10,7.00,12.43,16.55,DUR];
  let c0=0,c1=DUR;
  for(let i=0;i<cuts.length-1;i++) if(tm>=cuts[i]&&tm<cuts[i+1]){c0=cuts[i];c1=cuts[i+1];}
  elCam.style.transform=`scale(${iv(tm,c0,Math.min(c1,c0+6),1,1.02)})`;

  /* ---- words ---- */
  const ink=inkAt(t), acc=accentAt(t);
  for(const w of wordEls){
    const S=w.S, t0=w.t+OFFSET;
    const vis = t>=S.in-0.2 && t<S.out+0.35;
    if(!vis){ w.el.style.opacity=0; continue; }
    const start = w.accent ? t0+0.06 : t0;
    const p  = clamp((t-start)/0.22,0,1);
    const e  = expoOut(p);
    let sc, y = 18*(1-e);
    if(w.accent){ sc = pop(t,start,0.30,0.90,1.06,1.00); }
    else        { sc = lerp(0.94,1,e); }
    /* the sentence leaves as a block on the background flip */
    const outP = clamp((t-S.out)/0.30,0,1);
    const oe   = expoIn(outP);
    const op   = clamp((t-start)/0.13,0,1) * (1-oe);
    y += -26*oe;
    w.el.style.opacity   = op;
    w.el.style.transform = `translateY(${y}px) scale(${sc})`;
    w.el.style.color     = w.accent ? acc : ink;
    w.el.style.fontWeight= w.accent ? 800 : (S===S1?600:600);
    w.el.style.fontFamily= DISPFONT;
    w.el.style.textShadow= dark && !w.accent ? '0 0 18px rgba(255,255,255,0.35)' : 'none';
  }
  SENTENCES.forEach(S=>S.el.forEach(l=>{
    l.style.transform=`scale(${CAPS})`;
    l.style.transformOrigin = S===S4 ? '50% 50%' : '0% 50%';
  }));

  /* ---- image helper: enter, float, exit ---- */
  function place(el,{in:tin,out:tout,fx,fy,frot,rot,dur=0.45,exitDx=0,exitDy=0,fs=0.85}){
    const inP  = clamp((t-tin)/dur,0,1), e=expoOut(inP);
    const outP = clamp((t-tout)/0.30,0,1), oe=expoIn(outP);
    if(t<tin-0.02 || outP>=1){ el.style.opacity=0; return false; }
    const fl = Math.sin(tm/3.2*Math.PI*2)*6;           // deterministic float
    const fr = Math.sin(tm/4.7*Math.PI*2)*1.5;
    const x  = lerp(fx,0,e) + exitDx*oe;
    const y  = lerp(fy,0,e) + fl*e*(1-oe) + exitDy*oe;
    const r  = lerp(frot,rot,e) + fr*e*(1-oe);
    const s  = lerp(fs,1,e);
    el.style.opacity   = clamp(inP*3,0,1)*(1-oe);
    el.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`;
    el.style.filter    = dark ? 'drop-shadow(0 0 26px rgba(255,255,255,.14))'
                              : 'drop-shadow(0 24px 48px rgba(0,0,0,.25))';
    return true;
  }

  /* BEAT 1 — the check */
  const checkShrink = t>=1.19 ? 0.94 : 1;
  if(place(iCheck,{in:0.13,out:2.90,fx:520,fy:420,frot:-22,rot:-8,exitDx:420,exitDy:300})){
    const cs=iv(t,1.19,1.45,1,checkShrink,expoOut);
    iCheck.style.transform += ` scale(${cs})`;
  }
  {   /* FIRST OFFER stamp */
    const s=$('stampFirst');
    const p=clamp((t-1.19)/0.26,0,1);
    const vis = t>=1.19 && t<2.90;
    s.style.opacity = vis ? clamp(p*4,0,1)*(1-clamp((t-2.90)/0.25,0,1)) : 0;
    s.style.transform=`rotate(-12deg) scale(${pop(t,1.19,0.34,1.55,0.97,1.0)})`;
  }

  /* BEAT 2 — envelope, chart, note, road */
  place(iEnv,{in:3.15,out:6.80,fx:-560,fy:0,frot:-14,rot:6,exitDx:-460});
  {   /* road draws on, then drifts */
    const p=clamp((t-3.20)/0.60,0,1), e=expoOut(p);
    const on = t>=3.15 && t<11.98;
    roadPath.style.opacity = on ? (dark?0.42:0.28) : 0;
    roadPath.setAttribute('stroke',dark?'#6E675E':C.inkSoft);
    roadPath.style.strokeDasharray  = ROAD_LEN;
    roadPath.style.strokeDashoffset = ROAD_LEN*(1-e) - tm*0.5;
  }
  {   /* bar chart — one stubby bar rises and stops */
    const ch=$('chart'), on=t>=4.31&&t<6.80;
    ch.style.opacity = on ? clamp((t-4.31)*5,0,1)*(1-clamp((t-6.60)/0.2,0,1)) : 0;
    $('bar1').style.height = iv(t,4.31,4.72,0,64,expoOut)+'px';
    $('bar2').style.height = iv(t,4.31,4.72,0,190,expoOut)+'px';
    $('bar2').style.opacity= 0.30;
  }
  {   /* pinned note card */
    const n=$('note'), on=t>=5.61&&t<6.90;
    const p=clamp((t-5.61)/0.42,0,1);
    n.style.opacity = on ? clamp(p*4,0,1)*(1-clamp((t-6.72)/0.18,0,1)) : 0;
    const sway=Math.sin(tm/3.6*Math.PI*2)*1;
    n.style.transform=`translateY(${iv(t,5.61,6.03,-150,0,expoOut)}px) rotate(${lerp(-3,sway,clamp(p,0,1))}deg)`;
    const lines=n.querySelectorAll('.noteline');
    [5.61,5.88,6.03].forEach((lt,i)=>{
      const lp=clamp((t-lt)/0.22,0,1);
      lines[i].style.opacity=lp;
      lines[i].style.transform=`translateX(${18*(1-expoOut(lp))}px)`;
    });
  }

  /* BEAT 3 — release, pen, signature, stamp, brace */
  const docShift = t>=9.99;
  if(place(iRelease,{in:7.06,out:11.98,fx:560,fy:-60,frot:20,rot:6,exitDy:-420})){
    const k=iv(t,9.99,10.45,0,1,expoOut);
    const tilt=iv(t,9.27,9.55,0,3,expoOut);
    iRelease.style.transform += ` translate(${k*70}px,${k*300}px) scale(${lerp(1,0.62,k)}) rotate(${tilt}deg)`;
  }
  place(iPen,{in:7.18,out:9.27,fx:420,fy:-120,frot:34,rot:0,exitDy:820,exitDx:120});
  {   /* signature draws on "sign" */
    const p=clamp((t-7.57)/0.50,0,1);
    const on=t>=7.57&&t<11.98;
    sigPath.style.opacity = on ? 1-clamp((t-9.99)/0.3,0,1) : 0;
    sigPath.style.strokeDasharray=SIG_LEN;
    sigPath.style.strokeDashoffset=SIG_LEN*(1-expoOut(p));
    $('sig').style.opacity = on?1:0;
  }
  {   /* CASE CLOSED */
    const s=$('stampClosed'), on=t>=9.27&&t<11.98;
    const p=clamp((t-9.27)/0.26,0,1);
    s.style.opacity= on ? clamp(p*4,0,1)*(1-clamp((t-9.99)/0.30,0,1)) : 0;
    s.style.transform=`rotate(-9deg) scale(${pop(t,9.27,0.34,1.5,0.97,1.0)})`;
  }
  place(iBrace,{in:10.61,out:11.98,fx:-520,fy:0,frot:-12,rot:-3,exitDx:-460});
  {   /* treatment progress bar — still filling */
    const pw=$('progWrap'), on=t>=10.61&&t<11.98;
    pw.style.opacity= on ? clamp((t-10.61)*4,0,1)*(1-clamp((t-11.80)/0.18,0,1)) : 0;
    const pct=iv(t,10.61,11.98,0,46,null);
    $('progFill').style.width=pct+'%';
    $('progPct').textContent=Math.round(pct)+'%';
  }

  /* CIRCLE WIPE into the brand beat (11.98 -> 12.43) */
  {
    const p=clamp((t-11.98)/0.45,0,1);
    if(p>0&&p<1){
      const r=expoInOut(p)*1240;
      elWipe.innerHTML=`<svg width="1080" height="1920"><circle cx="540" cy="960" r="${r}"
        fill="${mixHex(C.black,C.brand,clamp((p-0.45)/0.55,0,1))}"/></svg>`;
      elWipe.style.opacity=1;
    } else elWipe.style.opacity=0;
  }

  /* BEAT 4 — wordmark, ring, dots, skyline, phone */
  {
    const m=$('mark'), on=t>=12.43&&t<16.19;
    m.style.opacity= on ? clamp((t-12.43)/0.18,0,1)*(1-clamp((t-16.05)/0.16,0,1)) : 0;
    m.style.fontFamily=DISPFONT;
    m.style.transform=`scale(${pop(t,12.43,0.55,0.72,1.05,1.0)})`;
    const rp=clamp((t-12.55)/0.50,0,1);
    ringC.style.strokeDasharray=RING_LEN;
    ringC.style.strokeDashoffset=RING_LEN*(1-expoOut(rp));
    $('ring').style.opacity= on ? (1-clamp((t-15.09)/0.5,0,1)) : 0;
  }
  {
    const d=$('dots'), on=t>=13.11&&t<16.19;
    d.style.opacity= on ? clamp((t-13.11)/0.25,0,1)*(1-clamp((t-14.60)/0.42,0,1)) : 0;
    const lp=clamp((t-13.83)/0.34,0,1);
    $('link').style.width=(expoOut(lp)*612)+'px';
    const mv=1-clamp((t-13.83)/0.24,0,1);
    $('dotM1').style.opacity=mv; $('dotM2').style.opacity=mv;
    $('dotL').style.transform=`scale(${pop(t,13.11,0.3,0.4,1.1,1)})`;
    $('dotR').style.transform=`scale(${pop(t,13.11,0.3,0.4,1.1,1)})`;
  }
  {
    const p=clamp((t-14.27)/0.55,0,1), on=t>=14.27&&t<16.19;
    iSky.style.opacity= on ? 1-clamp((t-16.05)/0.16,0,1) : 0;
    iSky.style.transform=`translateY(${lerp(300,-190,expoOut(p))}px)`;
    iSky.style.filter='none';
  }
  place(iPhone,{in:15.09,out:16.10,fx:520,fy:40,frot:16,rot:-4,exitDx:460});

  /* CARD SLIDE into the CTA (16.15 -> 16.55) */
  {
    const p=clamp((t-16.15)/0.40,0,1);
    if(p>0&&p<1){
      elCard.style.opacity=1;
      elCard.style.background=C.cream;
      elCard.style.transform=`translateY(${lerp(-1920,0,expoOut(p))}px)`;
    } else elCard.style.opacity=0;
  }

  /* BEAT 5 — the end card */
  {
    const on=t>=16.49;
    const up=clamp((t-18.26)/0.60,0,1), ue=expoOut(up);
    const shift=-80*ue, sc=lerp(1,0.70,ue);
    const c1=$('cta1'), c2=$('cta2');
    c1.style.opacity= on?clamp((t-16.49)/0.16,0,1):0;
    c2.style.opacity= t>=17.32?clamp((t-17.32)/0.16,0,1):0;
    c1.style.fontFamily=c2.style.fontFamily=DISPFONT;
    c1.style.color=C.ink; c2.style.color=ACCENT;
    c1.style.transform=`translateY(${shift}px) scale(${pop(t,16.49,0.40,0.86,1.06,1)*sc})`;
    c2.style.transform=`translateY(${shift}px) scale(${pop(t,17.32,0.40,0.86,1.06,1)*sc})`;

    $('url').style.opacity=clamp((t-18.26)/0.30,0,1);
    $('url').style.transform=`translateY(${18*(1-ue)}px)`;
    $('url').style.fontFamily=DISPFONT;

    const b=$('btn');
    const breathe = t>=18.26 ? 1+0.015+0.015*Math.sin((tm-18.26)/1.6*Math.PI*2) : 1;
    b.style.opacity=clamp((t-18.40)/0.30,0,1);
    b.style.transform=`scale(${pop(t,18.40,0.45,0.80,1.05,1)*breathe})`;
    b.style.background=ACCENT;

    const dc=$('disclaimer');
    dc.style.opacity= t>=19.20 ? clamp((t-19.20)/0.5,0,1) : 0;
    dc.textContent=DISCLAIMER;
  }

  /* persistent chrome */
  const wm=$('wm'), hd=$('handle');
  wm.textContent='Awesome Attorneys';
  hd.textContent='@AwesomeAttys';
  const chromeCol = dark?'rgba(255,255,255,.62)':'rgba(20,17,15,.5)';
  wm.style.color=hd.style.color=chromeCol;
  const fadeChrome = t>=16.19 ? 1-clamp((t-16.19)/0.4,0,1) : 1;
  wm.style.opacity=hd.style.opacity=fadeChrome;

}

/* ---------- controls (excluded from the render) -------------------------- */
let OFFSET=0, DISCLAIMER=$('disc').value;
const scrub=$('scrub'), tval=$('tval'), vo=$('vo');
let playing=false, raf=0, t0=0, base=0;

function setT(t){ scrub.value=t; tval.textContent=t.toFixed(2)+'s'; render(t); }
scrub.oninput=()=>{ if(!playing){ vo.currentTime=Math.min(+scrub.value,20.0); } setT(+scrub.value); };
$('off').oninput=e=>{ OFFSET=+e.target.value; setT(+scrub.value); };
$('accent').oninput=e=>{ ACCENT=e.target.value; setT(+scrub.value); };
$('font').onchange=e=>{ DISPFONT=e.target.value; setT(+scrub.value); };
$('cap').oninput=e=>{ CAPS=+e.target.value/100; $('csz').textContent=e.target.value+'%'; setT(+scrub.value); };
$('disc').oninput=e=>{ DISCLAIMER=e.target.value; setT(+scrub.value); };
$('zones').onchange=e=>{ $('safe').style.display=e.target.checked?'block':'none'; };
$('play').onclick=()=>{
  playing=!playing; $('play').textContent=playing?'Pause':'Play';
  if(playing){ base=+scrub.value; t0=performance.now(); vo.currentTime=Math.min(base,20.0); vo.play(); tick(); }
  else { cancelAnimationFrame(raf); vo.pause(); }
};
function tick(){
  const t=base+(performance.now()-t0)/1000;
  if(t>=DUR){ setT(DUR); playing=false; $('play').textContent='Play'; vo.pause(); return; }
  setT(t); raf=requestAnimationFrame(tick);
}

/* fit the 1080x1920 stage into the window for previewing */
function fit(){
  const s=Math.min((window.innerHeight-32)/H,(window.innerWidth-380)/W,1);
  stage.style.transform=`scale(${s})`;
  document.body.style.height=(H*s+32)+'px';
  stage.style.marginRight=(-(W-W*s))+'px';
}
window.addEventListener('resize',fit);

/* the renderer calls this */
window.__render = t => { render(t); };
window.__ready  = false;
document.fonts.ready.then(()=>{ fit(); setT(0); window.__ready=true; });
</script>
